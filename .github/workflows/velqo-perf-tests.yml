# Velqo Performance Tests (k6) — runs a k6 script and publishes the summary to Velqo.
# One-time setup:
#   1. Commit this to .github/workflows/velqo-perf-tests.yml
#   2. Commit your k6 script at velqo/loadtest.js
#   3. Repo secrets: VELQO_INGEST_URL, VELQO_API_KEY, VELQO_API_TOKEN, VELQO_PROJECT_ID (optional).

name: Velqo Performance Tests

on:
  workflow_dispatch:
    inputs:
      velqo_run_id:     { description: "Velqo run id", required: false, default: "" }
      velqo_project_id: { description: "Velqo project id", required: false, default: "" }
  push:
    # The one file this workflow runs. "velqo/**" also matched velqo/ui-tests/**, so committing a
    # UI spec fired the load test — same fault as the API workflow had.
    paths:
      - "velqo/loadtest.js"
      - ".github/workflows/velqo-perf-tests.yml"

jobs:
  perf-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: grafana/setup-k6-action@v1
      - name: Run k6
        continue-on-error: true
        run: k6 run --summary-export=velqo-result.json velqo/loadtest.js

      - name: Publish results to Velqo
        if: always()
        env:
          VELQO_INGEST_URL: ${{ secrets.VELQO_INGEST_URL }}
          VELQO_API_KEY: ${{ secrets.VELQO_API_KEY }}
          VELQO_API_TOKEN: ${{ secrets.VELQO_API_TOKEN }}
        run: |
          RUN_ID="${{ github.event.inputs.velqo_run_id }}"
          if [ -z "$RUN_ID" ]; then RUN_ID="gh-${{ github.run_id }}"; fi
          PROJECT_ID="${{ github.event.inputs.velqo_project_id }}"
          if [ -z "$PROJECT_ID" ]; then PROJECT_ID="${{ secrets.VELQO_PROJECT_ID }}"; fi
          CI_RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          jq -n \
            --arg runId "$RUN_ID" --arg type "PERF" \
            --arg commit "${{ github.sha }}" --arg branch "${{ github.ref_name }}" \
            --arg ciRunUrl "$CI_RUN_URL" \
            --argjson projectId "${PROJECT_ID:-null}" \
            --slurpfile result velqo-result.json \
            '{runId:$runId, type:$type, commit:$commit, branch:$branch, ciRunUrl:$ciRunUrl, result:$result[0]}
               + (if $projectId != null then {projectId:$projectId} else {} end)' \
            > velqo-payload.json
          curl -sS --fail-with-body -X POST "$VELQO_INGEST_URL" \
            -H "Authorization: Bearer $VELQO_API_TOKEN" -H "X-Api-Key: $VELQO_API_KEY" -H "Content-Type: application/json" \
            --data @velqo-payload.json
